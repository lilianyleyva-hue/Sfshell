<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Especie Abla">
  <meta name="theme-color" content="#0b0d14">
  <title>Especie Abla</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d14; overflow: hidden; overscroll-behavior: none; }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
    /* La app entera es esta imagen: la dibuja el cerebro en C (gui.c). */
    #app { display: block; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; }
    #teclado { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
    #mensaje { position: fixed; inset: 0; display: grid; place-items: center; color: #8a90a6; font: 16px system-ui, sans-serif; text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <canvas id="app" aria-label="Especie Abla"></canvas>
  <div id="mensaje">Despertando a la especie…</div>
  <textarea id="teclado" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Teclado"></textarea>
  <input id="fotos" type="file" accept="image/*" multiple hidden>
  <video id="camara" playsinline muted hidden></video>
  <script src="wasi.js"></script>
  <script src="abla.js"></script>
  <script src="abla-wasm.js"></script>
  <script src="app.js"></script>
</body>
</html>
