  <script>
// Mini-WASI para el navegador: el cerebro en C (abla.wasm) usa fopen, mkdir,
// opendir… como en un disco de verdad. Aquí esas llamadas van a un sistema de
// archivos en memoria que se guarda en el navegador (IndexedDB).
//
// Script clásico (sin módulos) para que funcione también abriendo el archivo
// directamente, sin servidor, en Code App o Safari.
(function (global) {
  "use strict";

  const E = { EXITO: 0, BADF: 8, EXISTE: 20, INVAL: 28, ESDIR: 31, NOENT: 44, NOSYS: 52, NODIR: 54, NOVACIO: 55 };
  const TIPO = { CARACTER: 2, DIR: 3, ARCHIVO: 4 };
  const utf8 = new TextEncoder();
  const deUtf8 = new TextDecoder();

  // ---------- Sistema de archivos en memoria ----------
  class SistemaArchivos {
    constructor() {
      this.nodos = new Map([["", { dir: true, mtime: Date.now() }]]);
      this.sucios = new Set();
    }

    static normalizar(base, rel) {
      const partes = [];
      for (const p of (rel.startsWith("/") ? rel : base + "/" + rel).split("/")) {
        if (!p || p === ".") continue;
        if (p === "..") partes.pop();
        else partes.push(p);
      }
      return partes.join("/");
    }
    static padre(ruta) {
      const i = ruta.lastIndexOf("/");
      return i < 0 ? "" : ruta.slice(0, i);
    }

    obtener(ruta) { return this.nodos.get(ruta); }
    marcar(ruta) { this.sucios.add(ruta); }
    poner(ruta, nodo) { this.nodos.set(ruta, nodo); this.marcar(ruta); }
    quitar(ruta) { this.nodos.delete(ruta); this.marcar(ruta); }
    hijos(ruta) {
      const pre = ruta ? ruta + "/" : "";
      const r = [];
      for (const k of this.nodos.keys())
        if (k !== ruta && k.startsWith(pre) && !k.slice(pre.length).includes("/")) r.push(k.slice(pre.length));
      return r.sort();
    }
    leerTexto(ruta) {
      const n = this.nodos.get(SistemaArchivos.normalizar("", ruta));
      return n && !n.dir ? deUtf8.decode(n.datos.subarray(0, n.tam)) : null;
    }
  }

  // ---------- Persistencia en IndexedDB ----------
  const BD = "especie-abla", ALMACEN = "archivos";
  function abrirBD() {
    return new Promise((ok, mal) => {
      if (!global.indexedDB) return mal(new Error("sin IndexedDB"));
      const p = indexedDB.open(BD, 1);
      p.onupgradeneeded = () => p.result.createObjectStore(ALMACEN);
      p.onsuccess = () => ok(p.result);
      p.onerror = () => mal(p.error);
    });
  }

  SistemaArchivos.cargar = async function () {
    const fs = new SistemaArchivos();
    try {
      fs.bd = await abrirBD();
      await new Promise((ok, mal) => {
        const tx = fs.bd.transaction(ALMACEN, "readonly");
        const cur = tx.objectStore(ALMACEN).openCursor();
        cur.onsuccess = () => {
          const c = cur.result;
          if (!c) return ok();
          const v = c.value;
          fs.nodos.set(c.key, v.dir ? { dir: true, mtime: v.mtime } : { dir: false, datos: v.datos, tam: v.datos.length, mtime: v.mtime });
          c.continue();
        };
        cur.onerror = () => mal(cur.error);
      });
      fs.persistente = true;
    } catch (e) {
      fs.persistente = false; // modo privado o sin permiso: solo en memoria
    }
    fs.sucios.clear();
    return fs;
  };

  SistemaArchivos.prototype.guardar = function () {
    if (!this.bd || !this.sucios.size) return Promise.resolve(0);
    const rutas = [...this.sucios];
    this.sucios.clear();
    return new Promise((ok) => {
      const tx = this.bd.transaction(ALMACEN, "readwrite");
      const al = tx.objectStore(ALMACEN);
      for (const r of rutas) {
        const n = this.nodos.get(r);
        if (!n) al.delete(r);
        else if (n.dir) al.put({ dir: true, mtime: n.mtime }, r);
        else al.put({ dir: false, datos: n.datos.slice(0, n.tam), mtime: n.mtime }, r);
      }
      tx.oncomplete = () => ok(rutas.length);
      tx.onerror = () => { rutas.forEach((r) => this.sucios.add(r)); ok(0); };
    });
  };

  SistemaArchivos.prototype.borrarTodo = function () {
    this.nodos = new Map([["", { dir: true, mtime: Date.now() }]]);
    this.sucios.clear();
    const bd = this.bd;
    this.bd = null; // nada más se guarda: ni el autoguardado ni el de al cerrar
    if (!bd) return Promise.resolve();
    return new Promise((ok) => {
      const tx = bd.transaction(ALMACEN, "readwrite");
      tx.objectStore(ALMACEN).clear();
      tx.oncomplete = ok;
      tx.onerror = ok;
    });
  };

  // ---------- WASI preview1 (lo que usa abla.wasm) ----------
  function crearWasi(fs, alEscribir) {
    let memoria = null;
    const dv = () => new DataView(memoria.buffer);
    const bytes = () => new Uint8Array(memoria.buffer);
    const texto = (p, n) => deUtf8.decode(bytes().subarray(p, p + n));
    const fds = new Map([
      [0, { tipo: "entrada" }],
      [1, { tipo: "salida" }],
      [2, { tipo: "salida" }],
      [3, { tipo: "dir", ruta: "", preabierto: "." }],
    ]);
    let siguienteFd = 4;

    const resolver = (fd, p, n) => {
      const d = fds.get(fd);
      if (!d || d.tipo !== "dir") return null;
      return SistemaArchivos.normalizar(d.ruta, texto(p, n));
    };
    const crecer = (nodo, tam) => {
      if (tam <= nodo.datos.length) return;
      const nuevo = new Uint8Array(Math.max(tam, nodo.datos.length * 2, 64));
      nuevo.set(nodo.datos.subarray(0, nodo.tam));
      nodo.datos = nuevo;
    };
    const escribirStat = (p, nodo, ruta) => {
      const v = dv();
      for (let i = 0; i < 64; i++) v.setUint8(p + i, 0);
      let ino = 0;
      for (const c of ruta) ino = (ino * 31 + c.charCodeAt(0)) >>> 0;
      v.setBigUint64(p + 8, BigInt(ino), true);
      v.setUint8(p + 16, nodo.dir ? TIPO.DIR : TIPO.ARCHIVO);
      v.setBigUint64(p + 24, 1n, true);
      v.setBigUint64(p + 32, BigInt(nodo.dir ? 0 : nodo.tam), true);
      const t = BigInt(nodo.mtime || 0) * 1000000n;
      v.setBigUint64(p + 40, t, true);
      v.setBigUint64(p + 48, t, true);
      v.setBigUint64(p + 56, t, true);
    };

    const imports = {
      args_get: () => E.EXITO,
      args_sizes_get: (pn, pt) => { dv().setUint32(pn, 0, true); dv().setUint32(pt, 0, true); return E.EXITO; },
      environ_get: () => E.EXITO,
      environ_sizes_get: (pn, pt) => { dv().setUint32(pn, 0, true); dv().setUint32(pt, 0, true); return E.EXITO; },
      random_get: (p, n) => { crypto.getRandomValues(bytes().subarray(p, p + n)); return E.EXITO; },
      proc_exit: (c) => { throw new Error("abla terminó con código " + c); },

      clock_time_get: (id, _prec, p) => {
        const ns = id === 0 ? BigInt(Date.now()) * 1000000n : BigInt(Math.round(performance.now() * 1e6));
        dv().setBigUint64(p, ns, true);
        return E.EXITO;
      },

      fd_prestat_get: (fd, p) => {
        const d = fds.get(fd);
        if (!d || !d.preabierto) return E.BADF;
        dv().setUint8(p, 0);
        dv().setUint32(p + 4, utf8.encode(d.preabierto).length, true);
        return E.EXITO;
      },
      fd_prestat_dir_name: (fd, p, n) => {
        const d = fds.get(fd);
        if (!d || !d.preabierto) return E.BADF;
        bytes().set(utf8.encode(d.preabierto).subarray(0, n), p);
        return E.EXITO;
      },
      fd_fdstat_get: (fd, p) => {
        const d = fds.get(fd);
        if (!d) return E.BADF;
        const v = dv();
        v.setUint8(p, d.tipo === "dir" ? TIPO.DIR : d.tipo === "archivo" ? TIPO.ARCHIVO : TIPO.CARACTER);
        v.setUint16(p + 2, d.anexar ? 1 : 0, true);
        v.setBigUint64(p + 8, 0xffffffffffffffffn, true);
        v.setBigUint64(p + 16, 0xffffffffffffffffn, true);
        return E.EXITO;
      },
      fd_fdstat_set_flags: () => E.EXITO,
      fd_close: (fd) => (fds.delete(fd) ? E.EXITO : E.BADF),

      fd_write: (fd, iovs, n, pEscritos) => {
        const d = fds.get(fd);
        if (!d) return E.BADF;
        const v = dv();
        let total = 0;
        const trozos = [];
        for (let i = 0; i < n; i++) {
          const ptr = v.getUint32(iovs + i * 8, true), len = v.getUint32(iovs + i * 8 + 4, true);
          trozos.push(bytes().slice(ptr, ptr + len));
          total += len;
        }
        if (d.tipo === "salida") {
          if (alEscribir) alEscribir(trozos.map((t) => deUtf8.decode(t)).join(""));
        } else if (d.tipo === "archivo") {
          const nodo = fs.obtener(d.ruta);
          if (!nodo) return E.BADF;
          if (d.anexar) d.pos = nodo.tam;
          crecer(nodo, d.pos + total);
          for (const t of trozos) { nodo.datos.set(t, d.pos); d.pos += t.length; }
          nodo.tam = Math.max(nodo.tam, d.pos);
          nodo.mtime = Date.now();
          fs.marcar(d.ruta);
        } else return E.BADF;
        dv().setUint32(pEscritos, total, true);
        return E.EXITO;
      },

      fd_read: (fd, iovs, n, pLeidos) => {
        const d = fds.get(fd);
        if (!d) return E.BADF;
        let total = 0;
        if (d.tipo === "archivo") {
          const nodo = fs.obtener(d.ruta);
          const v = dv();
          for (let i = 0; i < n; i++) {
            const ptr = v.getUint32(iovs + i * 8, true), len = v.getUint32(iovs + i * 8 + 4, true);
            const k = Math.max(0, Math.min(len, nodo.tam - d.pos));
            bytes().set(nodo.datos.subarray(d.pos, d.pos + k), ptr);
            d.pos += k;
            total += k;
            if (k < len) break;
          }
        }
        dv().setUint32(pLeidos, total, true);
        return E.EXITO;
      },

      fd_seek: (fd, desplazamiento, desde, pNueva) => {
        const d = fds.get(fd);
        if (!d || d.tipo !== "archivo") return E.BADF;
        const nodo = fs.obtener(d.ruta);
        const base = desde === 0 ? 0 : desde === 1 ? d.pos : nodo.tam;
        const nueva = base + Number(desplazamiento);
        if (nueva < 0) return E.INVAL;
        d.pos = nueva;
        dv().setBigUint64(pNueva, BigInt(nueva), true);
        return E.EXITO;
      },

      fd_readdir: (fd, buf, lenBuf, cookie, pUsado) => {
        const d = fds.get(fd);
        if (!d || d.tipo !== "dir") return E.BADF;
        const nombres = fs.hijos(d.ruta);
        let usado = 0;
        for (let i = Number(cookie); i < nombres.length; i++) {
          const nombre = utf8.encode(nombres[i]);
          const nodo = fs.obtener(d.ruta ? d.ruta + "/" + nombres[i] : nombres[i]);
          const ent = new Uint8Array(24 + nombre.length);
          const ev = new DataView(ent.buffer);
          ev.setBigUint64(0, BigInt(i + 1), true);
          ev.setBigUint64(8, BigInt(i + 1), true);
          ev.setUint32(16, nombre.length, true);
          ev.setUint8(20, nodo && nodo.dir ? TIPO.DIR : TIPO.ARCHIVO);
          ent.set(nombre, 24);
          const cabe = Math.min(ent.length, lenBuf - usado);
          bytes().set(ent.subarray(0, cabe), buf + usado);
          usado += cabe;
          if (usado >= lenBuf) break;
        }
        dv().setUint32(pUsado, usado, true);
        return E.EXITO;
      },

      path_filestat_get: (fd, _flags, p, n, pStat) => {
        const ruta = resolver(fd, p, n);
        if (ruta === null) return E.BADF;
        const nodo = fs.obtener(ruta);
        if (!nodo) return E.NOENT;
        escribirStat(pStat, nodo, ruta);
        return E.EXITO;
      },
      fd_filestat_get: (fd, pStat) => {
        const d = fds.get(fd);
        if (!d) return E.BADF;
        const nodo = d.tipo === "salida" || d.tipo === "entrada" ? { dir: false, tam: 0 } : fs.obtener(d.ruta);
        escribirStat(pStat, nodo, d.ruta || "");
        return E.EXITO;
      },

      path_create_directory: (fd, p, n) => {
        const ruta = resolver(fd, p, n);
        if (ruta === null) return E.BADF;
        if (fs.obtener(ruta)) return E.EXISTE;
        const padre = fs.obtener(SistemaArchivos.padre(ruta));
        if (!padre) return E.NOENT;
        if (!padre.dir) return E.NODIR;
        fs.poner(ruta, { dir: true, mtime: Date.now() });
        return E.EXITO;
      },

      path_open: (fd, _dirflags, p, n, oflags, _rb, _ri, fdflags, pFd) => {
        const ruta = resolver(fd, p, n);
        if (ruta === null) return E.BADF;
        let nodo = fs.obtener(ruta);
        const CREAR = 1, DIRECTORIO = 2, EXCLUSIVO = 4, TRUNCAR = 8;
        if (nodo && (oflags & EXCLUSIVO) && (oflags & CREAR)) return E.EXISTE;
        if (!nodo) {
          if (!(oflags & CREAR)) return E.NOENT;
          const padre = fs.obtener(SistemaArchivos.padre(ruta));
          if (!padre) return E.NOENT;
          if (!padre.dir) return E.NODIR;
          nodo = { dir: false, datos: new Uint8Array(64), tam: 0, mtime: Date.now() };
          fs.poner(ruta, nodo);
        }
        if ((oflags & DIRECTORIO) && !nodo.dir) return E.NODIR;
        if (nodo.dir) {
          fds.set(siguienteFd, { tipo: "dir", ruta });
        } else {
          if (oflags & TRUNCAR) { nodo.tam = 0; nodo.mtime = Date.now(); fs.marcar(ruta); }
          fds.set(siguienteFd, { tipo: "archivo", ruta, pos: 0, anexar: !!(fdflags & 1) });
        }
        dv().setUint32(pFd, siguienteFd++, true);
        return E.EXITO;
      },

      path_unlink_file: (fd, p, n) => {
        const ruta = resolver(fd, p, n);
        if (ruta === null) return E.BADF;
        const nodo = fs.obtener(ruta);
        if (!nodo) return E.NOENT;
        if (nodo.dir) return E.ESDIR;
        fs.quitar(ruta);
        return E.EXITO;
      },
      path_remove_directory: (fd, p, n) => {
        const ruta = resolver(fd, p, n);
        if (ruta === null) return E.BADF;
        const nodo = fs.obtener(ruta);
        if (!nodo) return E.NOENT;
        if (!nodo.dir) return E.NODIR;
        if (fs.hijos(ruta).length) return E.NOVACIO;
        fs.quitar(ruta);
        return E.EXITO;
      },
      path_rename: (fd, p, n, fd2, p2, n2) => {
        const a = resolver(fd, p, n), b = resolver(fd2, p2, n2);
        if (a === null || b === null) return E.BADF;
        const nodo = fs.obtener(a);
        if (!nodo) return E.NOENT;
        if (!fs.obtener(SistemaArchivos.padre(b))) return E.NOENT;
        const mover = [...fs.nodos.keys()].filter((k) => k === a || k.startsWith(a + "/"));
        for (const k of mover) {
          const v = fs.obtener(k);
          fs.quitar(k);
          fs.poner(b + k.slice(a.length), v);
        }
        return E.EXITO;
      },
    };

    // Cualquier otra llamada WASI: «no implementada», en vez de romper al cargar.
    const proxy = new Proxy(imports, { get: (t, k) => (k in t ? t[k] : () => E.NOSYS) });
    return { imports: proxy, usarMemoria: (m) => { memoria = m; } };
  }

  global.AblaWasi = { SistemaArchivos, crearWasi };
})(typeof window !== "undefined" ? window : globalThis);

</script>
  <script>
// Puente entre la interfaz y el cerebro en C (abla.wasm).
// El cerebro vive en WebAssembly; aquí solo se le pasan textos y se leen sus respuestas.
(function (global) {
  "use strict";
  const utf8 = new TextEncoder();
  const deUtf8 = new TextDecoder();

  function base64ABytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  class Cerebro {
    static async despertar({ wasm, fs, contexto = 1000000, alEscribir } = {}) {
      const { crearWasi, SistemaArchivos } = global.AblaWasi;
      fs = fs || (await SistemaArchivos.cargar());
      const wasi = crearWasi(fs, alEscribir || ((t) => console.log("[abla]", t)));
      const bytes = wasm || base64ABytes(global.ABLA_WASM_B64);
      const { instance } = await WebAssembly.instantiate(bytes, { wasi_snapshot_preview1: wasi.imports });
      wasi.usarMemoria(instance.exports.memory);
      instance.exports._initialize();
      const c = new Cerebro(instance.exports, fs);
      c.x.abla_iniciar_web(contexto);
      return c;
    }

    constructor(exports, fs) {
      this.x = exports;
      this.fs = fs;
    }

    cadena(ptr) {
      const mem = new Uint8Array(this.x.memory.buffer);
      let fin = ptr;
      while (mem[fin]) fin++;
      return deUtf8.decode(mem.subarray(ptr, fin));
    }

    conCadena(texto, fn) {
      const b = utf8.encode(texto);
      const p = this.x.abla_buffer(b.length + 1);
      const mem = new Uint8Array(this.x.memory.buffer);
      mem.set(b, p);
      mem[p + b.length] = 0;
      try {
        return fn(p);
      } finally {
        this.x.abla_liberar(p);
      }
    }

    ciclo() { this.x.abla_ciclo(); }
    ejecutar(linea) { return this.conCadena(linea, (p) => this.cadena(this.x.abla_ejecutar(p))); }
    prompt() { return this.cadena(this.x.abla_prompt()); }
    estado() { return JSON.parse(this.cadena(this.x.abla_estado_json())); }
    corriente(desde) { return JSON.parse(this.cadena(this.x.abla_corriente_json(desde))); }
    red(desde) { return JSON.parse(this.cadena(this.x.abla_red_json(desde))); }
    mente(id, n) { return JSON.parse(this.cadena(this.x.abla_mente_json(id, n))); }
    guardar() { this.x.abla_guardar(); return this.fs.guardar(); }
    ritmo() { return this.x.abla_ritmo(); }
    fijarRitmo(ms) { this.x.abla_fijar_ritmo(ms); }
    // la interfaz de terminal en C (tui.c)
    tuiHtml(columnas, filas) { return this.cadena(this.x.abla_tui_html(columnas, filas)); }
    tuiTeclas(s) { this.conCadena(s, (p) => this.x.abla_tui_teclas(p)); }
    // la app dibujada en C (gui.c)
    guiCuadro(w, h, escala, ahora) { return this.x.abla_gui_cuadro(w, h, escala, ahora); }
    guiPuntero(tipo, x, y) { this.x.abla_gui_puntero(tipo, x, y); }
    guiRueda(dy) { this.x.abla_gui_rueda(dy); }
    guiTeclas(s) { this.conCadena(s, (p) => this.x.abla_gui_teclas(p)); }
    guiPeticiones() { return this.x.abla_gui_peticiones(); }
    guiAviso(s) { this.conCadena(s, (p) => this.x.abla_gui_aviso(p)); }
    guiCamara(encendida) { this.x.abla_gui_camara(encendida ? 1 : 0); }
    // dejar un archivo en el mundo (por ejemplo, una foto para que la vean)
    escribirArchivo(ruta, bytes) {
      this.fs.poner(ruta, { dir: false, datos: bytes, tam: bytes.length, mtime: Date.now() });
    }
  }

  global.Cerebro = Cerebro;
})(typeof window !== "undefined" ? window : globalThis);

</script>

  <script>
// La app de la Especie Abla. Todo lo que ves lo dibuja el cerebro en C (gui.c,
// compilado a WebAssembly) en una imagen; esta página solo:
//   - copia esa imagen a la pantalla,
//   - le pasa los toques y las teclas,
//   - y hace lo que el C no puede hacer solo: abrir el selector de fotos y la cámara.
(function () {
  "use strict";

  const lienzo = document.getElementById("app");
  const ctx = lienzo.getContext("2d");
  const teclado = document.getElementById("teclado");
  const selector = document.getElementById("fotos");
  const video = document.getElementById("camara");
  const ESCALA = 2; // la interfaz está diseñada para pantallas retina, como la del iPad
  let cerebro = null, ancho = 0, alto = 0;

  // ---------- tamaño ----------
  function ajustar() {
    const r = lienzo.getBoundingClientRect();
    ancho = Math.max(320, Math.round(r.width * ESCALA));
    alto = Math.max(320, Math.round(r.height * ESCALA));
    lienzo.width = ancho;
    lienzo.height = alto;
  }

  // ---------- dibujar: el C pinta, aquí se copia ----------
  function dibujar() {
    const ptr = cerebro.guiCuadro(ancho, alto, ESCALA, performance.now());
    const px = new Uint8ClampedArray(cerebro.x.memory.buffer, ptr, ancho * alto * 4);
    ctx.putImageData(new ImageData(px, ancho, alto), 0, 0);
  }

  // ---------- lo que pide la interfaz ----------
  function atenderPeticiones() {
    const p = cerebro.guiPeticiones();
    if (p & 1) teclado.focus({ preventScroll: true });
    if (p & 2) selector.click();
    if (p & 4) alternarCamara();
  }

  // ---------- toques ----------
  function punto(e) {
    const r = lienzo.getBoundingClientRect();
    return [(e.clientX - r.left) * (ancho / r.width), (e.clientY - r.top) * (alto / r.height)];
  }
  lienzo.addEventListener("pointerdown", (e) => {
    lienzo.setPointerCapture(e.pointerId);
    cerebro && cerebro.guiPuntero(0, ...punto(e));
  });
  lienzo.addEventListener("pointermove", (e) => cerebro && cerebro.guiPuntero(1, ...punto(e)));
  lienzo.addEventListener("pointerup", (e) => {
    if (!cerebro) return;
    cerebro.guiPuntero(2, ...punto(e));
    dibujar(); // el toque se procesa ya, para que abrir fotos o el teclado ocurra dentro del gesto
    atenderPeticiones();
  });
  lienzo.addEventListener("pointercancel", (e) => cerebro && cerebro.guiPuntero(2, -1, -1));
  lienzo.addEventListener("wheel", (e) => {
    e.preventDefault();
    cerebro && cerebro.guiRueda(e.deltaY * ESCALA);
  }, { passive: false });

  // ---------- teclas (también el teclado en pantalla del iPad) ----------
  const ESPECIALES = { Enter: "\r", Backspace: "\x7f", Escape: "\x1b", ArrowUp: "\x1b[A", ArrowDown: "\x1b[B" };
  function tecla(e) {
    if (!cerebro || e.isComposing) return;
    const s = ESPECIALES[e.key];
    if (s) {
      e.preventDefault();
      cerebro.guiTeclas(s);
      if (s === "\r") cerebro.guardar();
    }
  }
  teclado.addEventListener("keydown", tecla);
  teclado.addEventListener("input", () => {
    const t = teclado.value.replace(/\n/g, "\r");
    teclado.value = "";
    if (cerebro && t) cerebro.guiTeclas(t);
  });
  // con teclado físico, escribir sin tocar antes un campo también funciona
  document.addEventListener("keydown", (e) => {
    if (e.target === teclado || !cerebro) return;
    if (e.key.length === 1 && !e.metaKey && !e.ctrlKey) {
      cerebro.guiTeclas(e.key);
      e.preventDefault();
    } else tecla(e);
  });

  // ---------- fotos: el navegador las abre, el C las mira ----------
  // Cada foto se reduce a 320×240 como mucho y se guarda como PPM (los píxeles RGB tal cual)
  // en mundo/fotos/entrada/. Desde ahí, la especie las va mirando una a una.
  const MAX_W = 320, MAX_H = 240;
  const pintor = document.createElement("canvas");
  const pctx = pintor.getContext("2d", { willReadFrequently: true });

  function aPPM(fuente, w0, h0) {
    const k = Math.min(1, MAX_W / w0, MAX_H / h0);
    const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
    pintor.width = w;
    pintor.height = h;
    pctx.imageSmoothingQuality = "high";
    pctx.drawImage(fuente, 0, 0, w, h);
    const rgba = pctx.getImageData(0, 0, w, h).data;
    const cab = new TextEncoder().encode(`P6\n${w} ${h}\n255\n`);
    const ppm = new Uint8Array(cab.length + w * h * 3);
    ppm.set(cab);
    for (let i = 0, j = cab.length; i < w * h; i++) {
      ppm[j++] = rgba[i * 4];
      ppm[j++] = rgba[i * 4 + 1];
      ppm[j++] = rgba[i * 4 + 2];
    }
    return ppm;
  }

  function cargarImagen(archivo) {
    if (window.createImageBitmap) return createImageBitmap(archivo);
    return new Promise((ok, mal) => {
      const img = new Image();
      img.onload = () => ok(img);
      img.onerror = mal;
      img.src = URL.createObjectURL(archivo);
    });
  }

  let numeroFoto = 0;
  selector.addEventListener("change", async () => {
    const archivos = [...selector.files];
    selector.value = "";
    if (!archivos.length) return;
    cerebro.guiAviso(`Preparando ${archivos.length} foto${archivos.length > 1 ? "s" : ""}…`);
    let bien = 0;
    const lote = Date.now();
    for (const a of archivos) {
      try {
        const img = await cargarImagen(a);
        const ppm = aPPM(img, img.width, img.height);
        const nombre = (a.name || "foto").replace(/\.[^.]+$/, "").replace(/[^\w\-áéíóúñÁÉÍÓÚÑ]+/g, "_").slice(0, 40);
        cerebro.escribirArchivo(`mundo/fotos/entrada/${lote}-${String(++numeroFoto).padStart(4, "0")}-${nombre}.ppm`, ppm);
        bien++;
      } catch (e) {
        console.warn("no pude abrir", a.name, e);
      }
    }
    cerebro.fs.guardar();
    cerebro.guiAviso(bien === archivos.length
      ? `${bien} foto${bien > 1 ? "s" : ""} en la cola. Las mirarán una a una.`
      : `${bien} de ${archivos.length} fotos en la cola (alguna no se pudo abrir).`);
  });

  // ---------- cámara: una foto cada pocos segundos mientras esté encendida ----------
  let flujo = null, tomas = null;
  async function alternarCamara() {
    if (flujo) {
      flujo.getTracks().forEach((t) => t.stop());
      flujo = null;
      clearInterval(tomas);
      cerebro.guiCamara(false);
      cerebro.guiAviso("Cámara apagada.");
      return;
    }
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("sin cámara");
      flujo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 640 } } });
      video.srcObject = flujo;
      await video.play();
      cerebro.guiCamara(true);
      cerebro.guiAviso("Cámara encendida: miran una imagen cada 4 segundos.");
      tomas = setInterval(() => {
        if (!video.videoWidth) return;
        const cola = (cerebro.fs.hijos("mundo/fotos/entrada") || []).length;
        if (cola > 3) return; // no amontonar: que terminen de mirar
        const ppm = aPPM(video, video.videoWidth, video.videoHeight);
        cerebro.escribirArchivo(`mundo/fotos/entrada/${Date.now()}-camara.ppm`, ppm);
      }, 4000);
    } catch (e) {
      flujo = null;
      cerebro.guiCamara(false);
      cerebro.guiAviso("La cámara no está disponible aquí. Usa «Añadir fotos».");
    }
  }

  // ---------- arranque y bucle que nunca para ----------
  async function iniciar() {
    try {
      cerebro = await Cerebro.despertar({});
    } catch (e) {
      document.getElementById("mensaje").textContent = "No pude despertar a la especie: " + e.message;
      return;
    }
    document.getElementById("mensaje").remove();
    let ritmo = 300;
    try { ritmo = Number(localStorage.getItem("abla-ritmo")) || 300; } catch (_) {}
    cerebro.fijarRitmo(ritmo);
    ajustar();
    addEventListener("resize", ajustar);

    // pensar: todos los ciclos que tocan según el ritmo (y ponerse al día al volver)
    let ultimo = performance.now();
    setInterval(() => {
      const r = cerebro.ritmo(), ahora = performance.now();
      let n = Math.floor((ahora - ultimo) / r);
      if (n > 0) {
        if (n > 200) { n = 200; ultimo = ahora - r; }
        for (let i = 0; i < n; i++) cerebro.ciclo();
        ultimo += n * r;
      }
    }, 25);

    // dibujar unas 15 veces por segundo
    let ultimoCuadro = 0;
    function cuadro(t) {
      if (!document.hidden && t - ultimoCuadro >= 66) {
        dibujar();
        atenderPeticiones();
        ultimoCuadro = t;
      }
      requestAnimationFrame(cuadro);
    }
    requestAnimationFrame(cuadro);

    setInterval(() => {
      cerebro.guardar();
      try { localStorage.setItem("abla-ritmo", String(cerebro.ritmo())); } catch (_) {}
    }, 10000);
    document.addEventListener("visibilitychange", () => { if (document.hidden) cerebro.guardar(); });
    addEventListener("pagehide", () => cerebro.guardar());
  }

  iniciar();
})();

</script>
